version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: backend-dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  client:
    image: node:20-alpine
    container_name: client-dev
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"