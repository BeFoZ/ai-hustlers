services:
  backend:
    build:
      context: ./backend
    container_name: ai-hustlers-backend
    restart: unless-stopped
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
    container_name: ai-hustlers-client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
